# Supabase local development configuration.
# Run `supabase start` from the project root (requires Supabase CLI) to spin
# up a local Postgres + Auth + Storage stack for development.

project_id = "backhaul"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Phone/OTP auth architecture is supported by Supabase but disabled by
# default in local dev (requires an SMS provider). Enable and configure a
# provider (Twilio, MessageBird, etc.) for production phone/OTP login.
[auth.sms]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"
